version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # a week catches most compromised releases, security updates skip the wait
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    ignore:
      # setup-zine v2 needs Zine 0.12, which breaks the config of the pinned 0.11.3
      - dependency-name: "kristoff-it/setup-zine"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "yuku"
      # TypeScript 7 drops the compiler API the tsc differential test uses, and
      # @typescript-eslint/typescript-estree requires < 6.1.0
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
